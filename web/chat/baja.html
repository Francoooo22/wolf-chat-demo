<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avisos de Wolf Travel</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B34DC">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
  <link rel="stylesheet" href="chat.css">
  <style>
    .baja { max-width: 460px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    .baja img { width: 64px; height: 64px; object-fit: contain; }
    .baja h1 { margin: 18px 0 8px; font-size: 24px; font-weight: 900; color: var(--marino); }
    .baja p { margin: 0 0 14px; color: var(--gris); }
    .baja .boton { display: inline-block; text-decoration: none; }
  </style>
</head>
<body>
  <main class="baja">
    <img id="logo" alt="Wolf Travel">
    <h1 id="titulo">Un momento…</h1>
    <p id="texto">Estamos procesando tu pedido.</p>
    <a class="boton" id="volver" href="./" hidden>Ir al chat de Wolf</a>
  </main>
  <script type="module">
    import { CONFIG } from '../js/config.js';
    import { crearApiCliente } from '../js/api.js';

    const $ = (s) => document.querySelector(s);
    $('#logo').src = CONFIG.MARCA.logo;
    const p = new URLSearchParams(location.search);
    const listo = (titulo, texto) => {
      $('#titulo').textContent = titulo;
      $('#texto').textContent = texto;
      $('#volver').hidden = false;
    };

    try {
      if (!p.get('c') || !p.get('t')) throw new Error('El enlace está incompleto. Copialo completo desde el correo.');
      await crearApiCliente().bajaAvisos(p.get('c'), p.get('t'));
      listo('Listo, no te mandamos más avisos',
        'Vas a seguir recibiendo solo los correos sobre tus consultas en el chat. '
        + 'Si querés volver a recibir avisos, pedíselo a quien te atienda.');
    } catch (e) {
      listo('No pudimos darte de baja', e.message || 'Probá de nuevo más tarde.');
    }
  </script>
</body>
</html>
